backend:
  name: github
  repo: bakerlin8/8aker-site
  branch: main
  base_url: https://8aker-site.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "zh_Hant"

collections:
  - name: "site"
    label: "首頁文案"
    files:
      - file: "src/data/site-copy.json"
        label: "首頁文案"
        name: "homepage"
        fields:
          - { label: "序章｜標題前段", name: "hero_title_prefix", widget: "string" }
          - { label: "序章｜標題強調字", name: "hero_title_highlight", widget: "string" }
          - { label: "序章｜標題後段", name: "hero_title_suffix", widget: "string" }
          - { label: "序章｜說明文字", name: "hero_desc", widget: "text" }
          - { label: "倒數計時｜小標題", name: "countdown_eyebrow", widget: "string" }
          - { label: "倒數計時｜標籤文字", name: "countdown_label", widget: "string" }
          - { label: "倒數計時｜起算時間（ISO 格式）", name: "countdown_start", widget: "string" }
          - { label: "倒數計時｜目標時間（ISO 格式）", name: "countdown_target", widget: "string" }
          - { label: "五柱區｜標題前段", name: "carousel_title_prefix", widget: "string" }
          - { label: "五柱區｜標題強調字", name: "carousel_title_highlight", widget: "string" }
          - { label: "結尾章｜標題前段", name: "closing_title_prefix", widget: "string" }
          - { label: "結尾章｜標題強調字", name: "closing_title_highlight", widget: "string" }
          - { label: "結尾章｜說明文字", name: "closing_desc", widget: "text" }
          - { label: "複利證明牆｜引言", name: "proof_intro", widget: "text" }
          - { label: "關於我｜開場金句", name: "about_lede", widget: "text" }
          - { label: "關於我｜第一段（困境／開場）", name: "about_p1", widget: "text" }
          - { label: "關於我｜第二段（複利轉折）", name: "about_p2", widget: "text" }
          - { label: "關於我｜第三段（現在）", name: "about_p3", widget: "text" }
          - { label: "訂閱區｜標題前段", name: "subscribe_title_prefix", widget: "string" }
          - { label: "訂閱區｜標題強調字", name: "subscribe_title_highlight", widget: "string" }
          - { label: "訂閱區｜標題後段", name: "subscribe_title_suffix", widget: "string" }
          - { label: "訂閱區｜說明文字", name: "subscribe_desc", widget: "text" }
          - { label: "訂閱區｜價格（例：NT$150）", name: "subscribe_price", widget: "string" }
          - { label: "訂閱區｜Stripe 連結", name: "subscribe_url", widget: "string" }
          - { label: "Dashboard 導引｜第一行前段", name: "bridge_line1_prefix", widget: "string" }
          - { label: "Dashboard 導引｜第一行強調字", name: "bridge_line1_highlight", widget: "string" }
          - { label: "Dashboard 導引｜第一行後段", name: "bridge_line1_suffix", widget: "string" }
          - { label: "Dashboard 導引｜第二行前段", name: "bridge_line2_prefix", widget: "string" }
          - { label: "Dashboard 導引｜第二行強調字", name: "bridge_line2_highlight", widget: "string" }
          - { label: "Dashboard 導引｜第二行後段", name: "bridge_line2_suffix", widget: "string" }

  - name: "proof"
    label: "複利證明牆卡片"
    files:
      - file: "src/data/proof-cards.json"
        label: "三張卡片"
        name: "proofcards"
        fields:
          - label: "卡片列表"
            name: "cards"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "數字（例：12）", name: "stat", widget: "string" }
              - { label: "單位（例：小時完成）", name: "unit", widget: "string" }
              - { label: "標題", name: "title", widget: "string" }
              - { label: "備註（例：省下 3 小時／月）", name: "meta", widget: "string" }
              - { label: "截圖區文字（尚無截圖時顯示）", name: "shot_label", widget: "string" }

  - name: "strengthen"
    label: "強化・運動與健康"
    folder: "src/content/strengthen"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - { label: "先存草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "emit"
    label: "放出・輸出與分享"
    folder: "src/content/emit"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - { label: "先存草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "operate"
    label: "操作・AI 學習筆記"
    folder: "src/content/operate"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - { label: "先存草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "conjure"
    label: "具現・從無到有的建置"
    folder: "src/content/conjure"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - { label: "先存草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "transmute"
    label: "變化・心境筆記"
    folder: "src/content/transmute"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - { label: "先存草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }
