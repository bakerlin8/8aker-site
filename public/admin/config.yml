backend:
  name: github
  repo: bakerlin8/8aker-site
  branch: main
  base_url: https://8aker-site.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "zh_Hant"

collections:
  - name: "site"
    label: "首頁文案"
    files:
      - file: "src/data/site-copy.json"
        label: "首頁文案"
        name: "homepage"
        fields:
          - { label: "座右銘第一行", name: "motto_line1", widget: "string" }
          - { label: "座右銘第二行", name: "motto_line2", widget: "string" }
          - { label: "座右銘說明", name: "hero_lede", widget: "text" }
          - { label: "倒數標籤", name: "countdown_label", widget: "string" }
          - { label: "累積帳起算日", name: "countdown_start", widget: "string" }
          - { label: "第一卷發售日", name: "countdown_target", widget: "string" }
          - { label: "今日稽古標題", name: "board_title", widget: "string" }
          - { label: "累積帳標籤", name: "ledger_label", widget: "string" }
          - { label: "五個方向小標", name: "five_sub", widget: "string" }
          - { label: "五個方向標題", name: "five_title", widget: "string" }
          - { label: "連載小標", name: "chapters_sub", widget: "string" }
          - { label: "連載標題", name: "chapters_title", widget: "string" }
          - { label: "身體小標", name: "body_sub", widget: "string" }
          - { label: "身體標題", name: "body_title", widget: "string" }
          - { label: "成果小標", name: "works_sub", widget: "string" }
          - { label: "成果標題", name: "works_title", widget: "string" }
          - { label: "筆記小標", name: "journal_sub", widget: "string" }
          - { label: "筆記標題", name: "journal_title", widget: "string" }
          - { label: "關於小標", name: "about_meta", widget: "string" }
          - { label: "關於名字", name: "about_name", widget: "string" }
          - { label: "關於開場", name: "about_lede", widget: "text" }
          - { label: "關於第一段", name: "about_p1", widget: "text" }
          - { label: "關於第二段", name: "about_p2", widget: "text" }
          - { label: "訂閱標題", name: "subscribe_title", widget: "string" }
          - { label: "訂閱說明", name: "subscribe_desc", widget: "text" }
          - { label: "訂閱價格", name: "subscribe_price", widget: "string" }
          - { label: "Stripe 連結", name: "subscribe_url", widget: "string" }
          - { label: "網站名稱", name: "site_name", widget: "string" }
          - { label: "生日", name: "birth_date", widget: "string" }

  - name: "works"
    label: "成果"
    files:
      - file: "src/data/works.json"
        label: "成果卡片"
        name: "works"
        fields:
          - label: "成果"
            name: "works"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "方向", name: "dir", widget: "select", options: ["strengthen","emit","operate","conjure","transmute"] }
              - { label: "年月", name: "date", widget: "string" }
              - { label: "名稱", name: "title", widget: "string" }
              - { label: "說明", name: "desc", widget: "text" }
              - { label: "花費小時", name: "spent", widget: "string" }
              - { label: "每月省下", name: "saved", widget: "string" }

  - name: "strengthen"
    label: "強化・運動與健康"
    folder: "src/content/strengthen"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - { label: "先存草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "emit"
    label: "放出・輸出與分享"
    folder: "src/content/emit"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - { label: "先存草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "operate"
    label: "操作・AI 學習筆記"
    folder: "src/content/operate"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - { label: "先存草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "conjure"
    label: "具現・從無到有的建置"
    folder: "src/content/conjure"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - { label: "先存草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "transmute"
    label: "變化・心境筆記"
    folder: "src/content/transmute"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "標籤", name: "tags", widget: "list", required: false }
      - { label: "先存草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }
