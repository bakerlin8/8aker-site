.brand{letter-spacing:.2em;font-weight:600;font-size:12px;margin-bottom:28px}

.sub{color:var(--ink2);margin:0 0 26px}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}

.chips button.on{background:var(--gold);color:#fff}
.lbl{font-size:11px;letter-spacing:.12em;color:var(--ink2);margin:14px 0 0;border-bottom:1px solid var(--line);padding-bottom:6px}
.note{background:var(--soft);border-left:3px solid var(--gold);padding:12px 14px;font-size:13px;margin-top:12px}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.field div{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:2px;min-height:42px}
.sign{height:110px;border:1px dashed var(--line);background:#F1EFEA;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-family:"Noto Serif CJK TC",serif;font-size:26px;font-style:italic}
.btn{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;padding:14px;border-radius:2px;letter-spacing:.1em}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}th{font-size:11px;letter-spacing:.1em;color:var(--ink2);font-weight:500}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--gold)}.tag.ok{background:#E3EBDD;color:#4B6B3A}.tag.wait{background:#F3E3D6;color:var(--red)}
.nav{display:flex;gap:22px;font-size:13px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--card)}.nav b{letter-spacing:.14em}
.admin{padding:28px}
/* LINE */
.line{background:#8FA7C4;min-height:100%;padding:28px 18px}
.bub{max-width:340px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bh{background:#8A6A3D;color:#fff;padding:16px 18px}.bh small{opacity:.85;display:block;font-size:12px}.bh b{font-size:17px}
.bc{padding:14px}.mini{background:#F6F3EE;border-radius:10px;padding:12px;margin-bottom:10px}
.mini .t{font-size:11px;color:#8A857E}.mini .n{font-weight:700;font-size:15px;margin:2px 0}.mini .r{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;gap:8px}
.mini .r span{color:#8A857E}.mini .r span.code{color:var(--red)}.red{color:var(--red);font-weight:700;font-size:12px;margin-top:6px}.code{font-size:20px;color:var(--red);font-weight:700}
.who{font-size:11px;color:#fff;margin:0 0 6px 4px;opacity:.9}

.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:6px;padding:10px 16px;align-items:center;flex-wrap:wrap}
.top b{letter-spacing:.16em;font-size:12px;margin-right:10px}
.tab{font:inherit;border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:2px;cursor:pointer;color:var(--ink2)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.demo{background:#F3E8C9;color:#6b5a1f;font-size:12px;text-align:center;padding:7px 12px}
.chips button{cursor:pointer}input.in{width:100%;font:inherit;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:2px}
canvas{width:100%;height:120px;border:1px dashed var(--line);background:#F1EFEA;touch-action:none;display:block}
.btn{cursor:pointer;border:0;font:inherit}.btn[disabled]{opacity:.35;cursor:not-allowed}
.sm{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;padding:4px 10px;border-radius:2px;cursor:pointer}
tr.row{cursor:pointer}tr.row:hover{background:var(--soft)}
.langs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}.langs button{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;padding:4px 12px;border-radius:12px;cursor:pointer}.langs button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.line{border-radius:6px}

.pbtn{font:inherit;width:100%;padding:12px;border:1px dashed var(--gold);background:var(--soft);color:var(--gold);border-radius:2px;cursor:pointer;letter-spacing:.04em}

.pstage canvas.wm.on{opacity:1}

@keyframes scan{from{top:-30%}to{top:100%}}

.psteps span{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;background:var(--soft)}
.psteps span.on{background:#E3EBDD;color:#4B6B3A}

.ptog{margin-top:10px}

<button class="btn" id="go" disabled></button>
